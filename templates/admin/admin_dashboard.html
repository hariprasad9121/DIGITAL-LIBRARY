{% extends "base.html" %}
{% block content %}
<h2 class="text-center my-4">Admin Dashboard</h2>

<div class="row">
    <!-- Left Side Vertical Panel -->
    <div class="col-md-3">
        <div class="d-grid gap-3">
            <a href="{{ url_for('manage_books') }}" class="btn btn-light btn-lg text-start border"> Books</a>
            <a href="{{ url_for('manage_members') }}" class="btn btn-light btn-lg text-start border"> Members</a>
            <a href="{{ url_for('transactions') }}" class="btn btn-light btn-lg text-start border">Transactions</a>
            <a href="{{ url_for('reports') }}" class="btn btn-light btn-lg text-start border">Reports</a>
            <a href="{{ url_for('manage_requests') }}" class="btn btn-light btn-lg text-start border"> Book Requests</a>
        </div>
    </div>

    <!-- Right Side Stats -->
    <div class="col-md-9">
        <div class="row mb-4">
            <div class="col-sm-3">
                <div class="border rounded text-center p-2 bg-white">
                    <div class="small">Total Books</div>
                    <div class="fw-bold">{{ total_books }}</div>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="border rounded text-center p-2 bg-white">
                    <div class="small">Issued Books</div>
                    <div class="fw-bold">{{ issued_books }}</div>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="border rounded text-center p-2 bg-white">
                    <div class="small">Total Fines</div>
                    <div class="fw-bold">₹{{ total_fines }}</div>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="border rounded text-center p-2 bg-white">
                    <div class="small">Total Members</div>
                    <div class="fw-bold">{{ total_members }}</div>
                </div>
            </div>
        </div>

        <!-- (Optional additional content for right panel can go here) -->
    </div>
</div>
{% endblock %}
